name: Validate CMS changes

on:
  pull_request:
    branches: [main]
    paths:
      - "cms-app/**"
      - "scripts/build_articles.py"
      - "content/articles/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m py_compile cms-app/app.py scripts/build_articles.py
      - name: Validate dependency declarations
        run: python -m pip install --dry-run -r cms-app/requirements.txt
