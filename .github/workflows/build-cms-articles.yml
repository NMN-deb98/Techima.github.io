name: Build CMS articles

on:
  push:
    branches: [main, cms-foundation]
    paths:
      - "content/articles/**"
      - "scripts/build_articles.py"
      - ".github/workflows/build-cms-articles.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cms-article-build-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Markdown renderer
        run: python -m pip install --disable-pip-version-check Markdown bleach

      - name: Build published article pages, index and sitemap
        run: python scripts/build_articles.py

      - name: Commit generated files if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles sitemap.xml
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Build CMS article pages and sitemap"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
