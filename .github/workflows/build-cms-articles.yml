name: Build CMS articles and pages

# Runs when the Techima CMS saves an article (content/articles/*.json changes),
# then writes the static pages, the article list and sitemap.xml back to main.
on:
  push:
    branches: [main]
    paths:
      - "content/articles/**"
      - "content/pages/**"
      - "content/site.json"
      - "scripts/apply_site_settings.py"
      - "scripts/build_articles.py"
      - ".github/workflows/build-cms-articles.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cms-article-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Markdown renderer and HTML sanitizer
        run: python -m pip install --disable-pip-version-check "Markdown>=3.6,<4" "bleach>=6.1,<7"

      - name: Apply site settings (menu, footer, hero, announcement)
        run: python scripts/apply_site_settings.py

      - name: Build article and page files, article list and sitemap
        run: python scripts/build_articles.py

      - name: Apply site settings to generated pages
        run: python scripts/apply_site_settings.py

      - name: Commit generated files if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Build CMS pages and sitemap"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
