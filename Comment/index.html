<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0b1020">
  <title>پنل بررسی کامنت‌های تکیما</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 35%,#182445 0%,#0b1020 58%,#070b14 100%);font-family:Tahoma,Arial,sans-serif;color:#f4f7ff}
    main{width:min(420px,100%);text-align:center;padding:38px 28px;border:1px solid #ffffff18;border-radius:24px;background:#ffffff08;box-shadow:0 24px 80px #0005;backdrop-filter:blur(12px)}
    .brand{width:62px;height:62px;margin:0 auto 25px;display:grid;place-items:center;border-radius:19px;background:linear-gradient(135deg,#38d9c5,#647dff);font-size:28px;font-weight:800;box-shadow:0 8px 30px #38d9c555}
    .spinner{width:58px;height:58px;margin:0 auto 24px;border:4px solid #ffffff20;border-top-color:#38d9c5;border-right-color:#8ca0ff;border-radius:50%;animation:spin .85s linear infinite}
    h1{font-size:20px;margin:0 0 12px;letter-spacing:-.3px}
    p{font-size:13px;line-height:2;color:#aeb9d2;margin:0}
    .dots:after{content:"";display:inline-block;width:1.5em;text-align:right;animation:dots 1.2s steps(4,end) infinite}
    .fallback{display:inline-block;margin-top:25px;padding:10px 16px;border-radius:10px;border:1px solid #ffffff25;color:#e5ebff;text-decoration:none;font-size:12px;transition:background .2s}
    .fallback:hover{background:#ffffff12}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%,100%{content:"..."}}
    @media(prefers-reduced-motion:reduce){.spinner{animation-duration:2.5s}.dots:after{animation:none;content:"..."}}
  </style>
  <meta http-equiv="refresh" content="0;url=../admin-comments.html">
</head>
<body>
  <main aria-live="polite">
    <div class="brand" aria-hidden="true">ت</div>
    <div class="spinner" role="status" aria-label="در حال بارگذاری"></div>
    <h1>پنل بررسی کامنت‌های تکیما</h1>
    <p>لطفاً چند لحظه صبر کن<span class="dots"></span></p>
    <a class="fallback" href="../admin-comments.html">ورود به پنل کامنت‌ها</a>
  </main>
</body>
</html>
