<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b1020">
  <link rel="icon" type="image/png" sizes="192x192" href="/Techima.github.io/favicon.png">
  <link rel="icon" type="image/svg+xml" href="/Techima.github.io/favicon.svg">
  <link rel="shortcut icon" href="/Techima.github.io/favicon.ico">
  <link rel="apple-touch-icon" sizes="192x192" href="/Techima.github.io/favicon.png">
  <link rel="manifest" href="/Techima.github.io/manifest.webmanifest">
<title>پنل بررسی کامنت‌های تکیما</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 35%,#1b2747 0%,#0b1020 60%,#070b14 100%);font-family:Tahoma,Arial,sans-serif;color:#f5f7ff}
main{width:min(420px,100%);text-align:center;padding:40px 26px;border:1px solid #ffffff1c;border-radius:24px;background:#ffffff09;box-shadow:0 24px 80px #0006}
.logo{width:58px;height:58px;display:grid;place-items:center;margin:0 auto 26px;border-radius:18px;background:linear-gradient(135deg,#35d5c0,#6577ff);font-size:28px;font-weight:bold;box-shadow:0 8px 30px #35d5c055}
.spinner{width:56px;height:56px;margin:0 auto 25px;border:4px solid #ffffff20;border-top-color:#35d5c0;border-left-color:#b0bcff;border-radius:50%;animation:spin .8s linear infinite}
h1{font-size:20px;margin:0 0 12px}p{font-size:13px;line-height:2;color:#b8c2d9;margin:0}
.dots:after{content:"";display:inline-block;width:1.5em;text-align:right;animation:dots 1.1s steps(4,end) infinite}
a{display:inline-block;margin-top:24px;padding:10px 16px;border:1px solid #ffffff2b;border-radius:10px;color:#e7ecff;text-decoration:none;font-size:12px}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%,100%{content:"..."}}
@media(prefers-reduced-motion:reduce){.spinner{animation-duration:2.5s}.dots:after{animation:none;content:"..."}}
</style>
</head>
<body>
<main aria-live="polite">
<div class="logo" aria-hidden="true">ت</div>
<div class="spinner" role="status" aria-label="در حال بارگذاری"></div>
<h1>پنل بررسی کامنت‌های تکیما</h1>
<p>در حال آماده‌سازی پنل بررسی نظرات<span class="dots"></span></p>
<a href="../admin-comments.html">ورود به پنل کامنت‌ها</a>
</main>
<script>
(function(){var target="../admin-comments.html";window.setTimeout(function(){window.location.replace(target)},1200)})();
</script>
</body>
</html>
